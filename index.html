<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ברוכים הבאים למשחק Real or Ai</title>
<style>
:root{--bg:#0b1c2c;--card:#13283c;--gold:#e8c36a;--ok:#3dcc8b;--bad:#e05a5a;--txt:#f4efe6}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,Assistant,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1b3a55,var(--bg));color:var(--txt);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 8px;color:var(--gold)}
.sub{opacity:.8;margin-bottom:24px}
.card{background:var(--card);border:1px solid #2a4a66;border-radius:16px;padding:20px;box-shadow:0 12px 40px #0006}
input,button{font:inherit}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3a5d7a;background:#0e2233;color:var(--txt);margin:8px 0 16px}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.primary{background:var(--gold);color:#1a1204;width:100%}
.row{display:flex;gap:12px}
.row button{flex:1}
.real{background:#2e6b4f;color:#fff}
.ai{background:#6b3a3a;color:#fff}
img.q,img.intro{width:100%;height:auto;max-height:70vh;object-fit:contain;object-position:center;background:#061018;border-radius:12px;margin:12px 0;display:block}
.intro-wrap{margin:4px 0 16px}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.95rem;margin-bottom:8px}
.timer{font-weight:800;color:var(--gold)}
.timer.low{color:var(--bad)}
.fb{margin:12px 0;padding:12px;border-radius:10px;font-weight:700}
.ok{background:#1c3d30;color:var(--ok)}
.no{background:#3d1c1c;color:#ffb3b3}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #2a4a66;text-align:right}
.rank{font-size:1.15rem;color:var(--gold);margin:12px 0}
.stats{line-height:1.7}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ברוכים הבאים למשחק Real or Ai</h1>
  <section id="gate" class="card">
    <p class="sub" style="margin-bottom:12px">לכבוד יום ההולדת 60 של גיל, נסו לנחש איזה תמונה אמיתית ואיזה לא. יש לכם 20 תמונות ודקה שלמה לנחש.</p>
    <div class="intro-wrap">
      <img id="introPhoto" class="intro" alt="" />
    </div>
    <input id="name" type="text" placeholder="שם מלא" autocomplete="name"/>
    <button class="primary" id="start">התחל</button>
  </section>
  <section id="play" class="card hidden">
    <div class="bar">
      <span id="prog"></span>
      <span id="score"></span>
      <span id="clock" class="timer"></span>
    </div>
    <img id="photo" class="q" alt="תמונה"/>
    <p>התמונה הזו אמיתית או נוצרה ב-AI?</p>
    <div class="row">
      <button class="real" id="btnReal">אמיתית</button>
      <button class="ai" id="btnAi">AI</button>
    </div>
    <div id="fb" class="hidden"></div>
    <button class="primary hidden" id="next" style="margin-top:12px">הבא</button>
  </section>
  <section id="end" class="card hidden">
    <h2>התוצאה</h2>
    <div class="stats" id="final"></div>
    <p class="rank" id="place"></p>
    <h3>עשרת הגדולים</h3>
    <table>
      <thead><tr><th>#</th><th>שם</th><th>נכונות</th><th>זמן</th></tr></thead>
      <tbody id="top"></tbody>
    </table>
    <button class="primary" id="again" style="margin-top:16px">שחק שוב</button>
  </section>
</div>
<script src="items/r1.js"></script>
<script src="items/r2.js"></script>
<script src="items/r3.js"></script>
<script src="items/r4.js"></script>
<script src="items/r5.js"></script>
<script src="items/r6.js"></script>
<script src="items/r7.js"></script>
<script src="items/r8.js"></script>
<script src="items/r9.js"></script>
<script src="items/r10.js"></script>
<script src="items/a1.js"></script>
<script src="items/a2.js"></script>
<script src="items/a3.js"></script>
<script src="items/a4.js"></script>
<script src="items/a5.js"></script>
<script src="items/a6.js"></script>
<script src="items/a7.js"></script>
<script src="items/a8.js"></script>
<script src="items/a9.js"></script>
<script src="items/a10.js"></script>
<script src="questions.js"></script>
<script>
(function setIntro(){
  const pool=window.GAME_ITEMS||[];
  const fixed=pool.find(x=>x.id==='a1' && String(x.src).startsWith('data:')) || pool.find(x=>x.label==='ai' && String(x.src||'').startsWith('data:'));
  if(fixed && fixed.src) document.getElementById('introPhoto').src=fixed.src;
})();
const KEY='gil-real-ai-board-v2';
const LIMIT=60;
let player='', items=[], i=0, score=0, wrong=0, locked=false;
let startedAt=0, elapsedMs=0, tick=null, done=false;
function loadBoard(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveBoard(b){localStorage.setItem(KEY,JSON.stringify(b))}
function shuffle(a){const x=a.slice();for(let k=x.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[x[k],x[j]]=[x[j],x[k]]}return x;}
function fmt(ms){const s=Math.max(0,ms)/1000;const m=Math.floor(s/60);const r=(s-m*60);return m? (m+':' + r.toFixed(1).padStart(4,'0')) : (r.toFixed(1)+' \u05e9\u05e0\u05f3');}
function remaining(){return Math.max(0, LIMIT*1000 - (Date.now()-startedAt));}
function paintClock(){const left=remaining();const el=document.getElementById('clock');el.textContent='\u05e0\u05d5\u05ea\u05e8\u05d5 '+Math.ceil(left/1000)+' \u05e9\u05e0\u05f3';el.classList.toggle('low', left<=10000);if(left<=0 && !done) finish(true);}
document.getElementById('start').onclick=()=>{
  player=document.getElementById('name').value.trim();
  if(player.split(/\s+/).length<2){alert('\u05e0\u05d0 \u05dc\u05d4\u05d6\u05d9\u05df \u05e9\u05dd \u05de\u05dc\u05d0 (\u05dc\u05e4\u05d7\u05d5\u05ea \u05e9\u05ea\u05d9 \u05de\u05d9\u05dc\u05d9\u05dd)');return}
  const raw=window.GAME_ITEMS||[];
  const seen={};
  const pool=raw.filter(x=>{
    if(!x||!x.src||!String(x.src).startsWith('data:')) return false;
    if(seen[x.id]) return false;
    seen[x.id]=1;
    return x.label==='real'||x.label==='ai';
  });
  items=shuffle(pool);
  i=0;score=0;wrong=0;done=false;locked=false;
  startedAt=Date.now();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('play').classList.remove('hidden');
  clearInterval(tick);
  tick=setInterval(paintClock,200);
  paintClock();
  show();
};
function show(){
  if(done)return;
  locked=false;
  document.getElementById('fb').className='hidden';
  document.getElementById('next').classList.add('hidden');
  document.getElementById('btnReal').disabled=false;
  document.getElementById('btnAi').disabled=false;
  document.getElementById('prog').textContent=(i+1)+' / '+items.length;
  document.getElementById('score').textContent='\u05e0\u05db\u05d5\u05df: '+score+' \u00b7 \u05d8\u05e2\u05d5\u05ea: '+wrong;
  document.getElementById('photo').src=items[i].src;
}
function choose(ans){
  if(locked||done)return;
  locked=true;
  const ok=ans===items[i].label;
  if(ok)score++; else wrong++;
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'ok':'no');
  const truth=items[i].label==='real'?'\u05d0\u05de\u05d9\u05ea\u05d9\u05ea':'AI';
  fb.textContent=ok?('\u05e0\u05db\u05d5\u05df! \u05d6\u05d5 \u05ea\u05de\u05d5\u05e0\u05d4 '+truth):('\u05dc\u05d0. \u05d6\u05d5 \u05ea\u05de\u05d5\u05e0\u05d4 '+truth);
  fb.classList.remove('hidden');
  document.getElementById('btnReal').disabled=true;
  document.getElementById('btnAi').disabled=true;
  document.getElementById('score').textContent='\u05e0\u05db\u05d5\u05df: '+score+' \u00b7 \u05d8\u05e2\u05d5\u05ea: '+wrong;
  document.getElementById('next').classList.remove('hidden');
}
document.getElementById('btnReal').onclick=()=>choose('real');
document.getElementById('btnAi').onclick=()=>choose('ai');
document.getElementById('next').onclick=()=>{if(done)return;i++;if(i>=items.length || remaining()<=0) finish(remaining()<=0); else show();};
function finish(timeout){
  if(done)return;
  done=true;
  clearInterval(tick);
  elapsedMs=Math.min(LIMIT*1000, Date.now()-startedAt);
  const unanswered=Math.max(0, items.length-(score+wrong));
  document.getElementById('play').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  const board=loadBoard();
  const entry={name:player,score,wrong,unanswered,ms:elapsedMs,t:Date.now(),timeout:!!timeout};
  board.push(entry);
  board.sort((a,b)=> (b.score-a.score) || ((a.ms||9e9)-(b.ms||9e9)) || (a.t-b.t));
  saveBoard(board);
  let rank=1;
  for(let k=0;k<board.length;k++){if(board[k].t===entry.t && board[k].name===player){rank=k+1;break}}
  document.getElementById('final').innerHTML='<strong>'+escapeHtml(player)+'</strong><br>\u05e0\u05d9\u05d7\u05e9 \u05e0\u05db\u05d5\u05df: <strong>'+score+'</strong><br>\u05d8\u05e2\u05d4: <strong>'+wrong+'</strong>'+(unanswered? ('<br>\u05dc\u05d0 \u05d4\u05e1\u05e4\u05d9\u05e7: '+unanswered):'')+'<br>\u05d6\u05de\u05df: <strong>'+fmt(elapsedMs)+'</strong>'+(timeout?' (\u05e0\u05d2\u05de\u05e8 \u05d4\u05d6\u05de\u05df)':'');
  document.getElementById('place').textContent='\u05d4\u05de\u05e7\u05d5\u05dd \u05e9\u05dc\u05da: '+rank+' \u05de\u05ea\u05d5\u05da '+board.length+' \u05de\u05e9\u05d7\u05e7\u05d9\u05dd';
  document.getElementById('top').innerHTML=board.slice(0,10).map((r,idx)=>'<tr><td>'+(idx+1)+'</td><td>'+escapeHtml(r.name)+'</td><td>'+r.score+'</td><td>'+fmt(r.ms||0)+'</td></tr>').join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
document.getElementById('again').onclick=()=>{document.getElementById('end').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');document.getElementById('name').value=player;};
</script>
</body>
</html>
