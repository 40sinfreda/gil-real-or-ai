<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ברוכים הבאים למשחק Real or Ai</title>
<style>
:root{--bg:#0b1c2c;--card:#13283c;--gold:#e8c36a;--ok:#3dcc8b;--bad:#e05a5a;--txt:#f4efe6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:Heebo,Assistant,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1b3a55,var(--bg));color:var(--txt)}
.wrap{max-width:720px;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));height:100%;display:flex;flex-direction:column}
h1{font-size:clamp(1.05rem,4.2vw,1.45rem);margin:0 0 6px;color:var(--gold);line-height:1.25;flex:0 0 auto}
.sub{opacity:.85;margin:0 0 8px;font-size:.9rem;line-height:1.35}
.card{background:var(--card);border:1px solid #2a4a66;border-radius:14px;padding:12px;box-shadow:0 8px 24px #0005;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#end.card{overflow:auto}
input,button{font:inherit}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a5d7a;background:#0e2233;color:var(--txt);margin:6px 0 10px}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.primary{background:var(--gold);color:#1a1204;width:100%}
.row{display:flex;gap:10px;flex:0 0 auto}
.row button{flex:1}
.real{background:#2e6b4f;color:#fff}
.ai{background:#6b3a3a;color:#fff}
.photo-box{position:relative;flex:1;min-height:0;margin:6px 0}
img.q,img.intro{width:100%;height:100%;object-fit:contain;object-position:center;background:#061018;border-radius:10px;display:block}
img.intro{height:auto;max-height:28dvh}
.intro-wrap{margin:0 0 8px;flex:1;min-height:0;display:flex}
.intro-wrap img{margin:auto}
.bar{display:flex;justify-content:space-between;gap:6px;flex-wrap:nowrap;font-size:.82rem;margin-bottom:4px;flex:0 0 auto}
.prompt{margin:4px 0 8px;font-size:.92rem;flex:0 0 auto}
.timer{font-weight:800;color:var(--gold);white-space:nowrap}
.timer.low{color:var(--bad)}
.fb{position:absolute;left:8px;right:8px;bottom:8px;margin:0;padding:8px 10px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.ok{background:#1c3d30cc;color:var(--ok)}
.no{background:#3d1c1ccc;color:#ffb3b3}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px;border-bottom:1px solid #2a4a66;text-align:right}
.rank{font-size:1rem;color:var(--gold);margin:8px 0}
.stats{line-height:1.55}
.hidden{display:none !important}
@media (max-height:700px){h1{font-size:1.05rem}.sub{font-size:.8rem}img.intro{max-height:22dvh}button{padding:10px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ברוכים הבאים למשחק Real or Ai</h1>
  <section id="gate" class="card">
    <p class="sub">לכבוד יום ההולדת 60 של גיל, נסו לנחש איזה תמונה אמיתית ואיזה לא. יש לכם 20 תמונות ודקה שלמה לנחש.</p>
    <div class="intro-wrap"><img id="introPhoto" class="intro" alt="" src="photos/ai/2UG01.jpg"/></div>
    <input id="name" type="text" placeholder="שם מ\u05dcא" autocomplete="name"/>
    <button class="primary" id="start">התחל</button>
  </section>
  <section id="play" class="card hidden">
    <div class="bar"><span id="prog"></span><span id="score"></span><span id="clock" class="timer"></span></div>
    <div class="photo-box"><img id="photo" class="q" alt=""/><div id="fb" class="hidden"></div></div>
    <p class="prompt">התמונה הזו אמיתית או נוצרה ב-AI?</p>
    <div class="row"><button class="real" id="btnReal">אמיתית</button><button class="ai" id="btnAi">AI</button></div>
  </section>
  <section id="end" class="card hidden">
    <h2>התוצאה</h2>
    <div class="stats" id="final"></div>
    <p class="rank" id="place"></p>
    <h3>עשרת הגדולים</h3>
    <table><thead><tr><th>#</th><th>שם</th><th>נכונות</th><th>זמן</th></tr></thead><tbody id="top"></tbody></table>
    <button class="primary" id="again" style="margin-top:12px">שחק שוב</button>
  </section>
</div>
<script src="manifest.js"></script>
<script>
(function setIntro(){
  const pool=window.GAME_ITEMS||[];
  const fixed=pool.find(x=>x.id==='a1') || pool.find(x=>x.label==='ai');
  if(fixed && fixed.src) document.getElementById('introPhoto').src=fixed.src;
})();
const CACHE_KEY='gil-real-ai-sheet';
const SHEET_API='https://script.google.com/macros/s/AKfycbwjIK3k7xbA4hAQ_d4PHYUV9cy-p9NQBJvwbOtPlVFb5RP6ep37H2LKTxtBuXdurb7E/exec';
const LIMIT=60;
let player='', items=[], i=0, score=0, wrong=0, locked=false;
let startedAt=0, elapsedMs=0, tick=null, done=false, cachedBoard=[];
try{cachedBoard=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]')}catch(e){cachedBoard=[]}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function fmt(ms){const s=Math.max(0,ms)/1000;const m=Math.floor(s/60);const r=(s-m*60);return m? (m+':' + r.toFixed(1).padStart(4,'0')) : (r.toFixed(1)+' \u05e9\u05e0\u05f3');}
function sortBoard(b){return b.slice().sort(function(a,c){return (c.score-a.score)||((a.ms||9e9)-(c.ms||9e9));});}
function paintBoard(board, me){
  board=sortBoard(board);
  if(me){
    var rank=1;
    for(var k=0;k<board.length;k++){if(board[k].name===me.name && Number(board[k].score)===me.score && Number(board[k].ms)===me.ms){rank=k+1;break;}}
    document.getElementById('place').textContent='\u05d4\u05de\u05e7\u05d5\u05dd \u05e9\u05dc\u05da: '+rank+' \u05de\u05ea\u05d5\u05da '+board.length+' \u05de\u05e9\u05d7\u05e7\u05d9\u05dd';
  }
  document.getElementById('top').innerHTML=board.slice(0,10).map(function(r,idx){return '<tr><td>'+(idx+1)+'</td><td>'+escapeHtml(r.name)+'</td><td>'+r.score+'</td><td>'+fmt(r.ms||0)+'</td></tr>';}).join('');
}
function pullBoard(){
  return fetch(SHEET_API+'?action=list').then(function(r){return r.json();}).then(function(data){
    cachedBoard=data.items||[];
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(cachedBoard))}catch(e){}
    return cachedBoard;
  });
}
pullBoard().catch(function(){});
function shuffle(a){const x=a.slice();for(let k=x.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[x[k],x[j]]=[x[j],x[k]]}return x;}
function remaining(){return Math.max(0, LIMIT*1000 - (Date.now()-startedAt));}
function paintClock(){const left=remaining();const el=document.getElementById('clock');el.textContent='\u05e0\u05d5\u05ea\u05e8\u05d5 '+Math.ceil(left/1000)+' \u05e9\u05e0\u05f3';el.classList.toggle('low', left<=10000);if(left<=0 && !done) finish(true);}
document.getElementById('start').onclick=()=>{
  player=document.getElementById('name').value.trim();
  if(player.split(/\s+/).length<2){alert('\u05e0\u05d0 \u05dc\u05d4\u05d6\u05d9\u05df \u05e9\u05dd \u05de\u05dc\u05d0 (\u05dc\u05e4\u05d7\u05d5\u05ea \u05e9\u05ea\u05d9 \u05de\u05d9\u05dc\u05d9\u05dd)');return}
  const raw=window.GAME_ITEMS||[];
  const seen={};
  const pool=raw.filter(x=>{
    const s=String(x.src||'');
    if(!s.startsWith('photos/ai/') && !s.startsWith('photos/real/')) return false;
    if(seen[x.id]) return false;
    seen[x.id]=1;
    return x.label==='real'||x.label==='ai';
  });
  items=shuffle(pool);
  i=0;score=0;wrong=0;done=false;locked=false;
  startedAt=Date.now();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('play').classList.remove('hidden');
  clearInterval(tick);
  tick=setInterval(paintClock,200);
  paintClock();
  show();
  pullBoard().catch(function(){});
};
function show(){
  if(done)return;
  locked=false;
  document.getElementById('fb').className='hidden';
  document.getElementById('btnReal').disabled=false;
  document.getElementById('btnAi').disabled=false;
  document.getElementById('prog').textContent=(i+1)+' / '+items.length;
  document.getElementById('score').textContent='\u05e0\u05db\u05d5\u05df: '+score+' \u00b7 \u05d8\u05e2\u05d5\u05ea: '+wrong;
  document.getElementById('photo').src=items[i].src;
}
function choose(ans){
  if(locked||done)return;
  locked=true;
  const ok=ans===items[i].label;
  if(ok)score++; else wrong++;
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'ok':'no');
  const truth=items[i].label==='real'?'\u05d0\u05de\u05d9\u05ea\u05d9\u05ea':'AI';
  fb.textContent=ok?('\u05e0\u05db\u05d5\u05df! \u05d6\u05d5 \u05ea\u05de\u05d5\u05e0\u05d4 '+truth):('\u05dc\u05d0. \u05d6\u05d5 \u05ea\u05de\u05d5\u05e0\u05d4 '+truth);
  fb.classList.remove('hidden');
  document.getElementById('btnReal').disabled=true;
  document.getElementById('btnAi').disabled=true;
  document.getElementById('score').textContent='\u05e0\u05db\u05d5\u05df: '+score+' \u00b7 \u05d8\u05e2\u05d5\u05ea: '+wrong;
  setTimeout(function(){
    if(done)return;
    i++;
    if(i>=items.length || remaining()<=0) finish(remaining()<=0);
    else show();
  }, 450);
}
document.getElementById('btnReal').onclick=function(){choose('real');};
document.getElementById('btnAi').onclick=function(){choose('ai');};
function finish(timeout){
  if(done)return;
  done=true;
  clearInterval(tick);
  elapsedMs=Math.min(LIMIT*1000, Date.now()-startedAt);
  const unanswered=Math.max(0, items.length-(score+wrong));
  document.getElementById('play').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('final').innerHTML='<strong>'+escapeHtml(player)+'</strong><br>\u05e0\u05d9\u05d7\u05e9 \u05e0\u05db\u05d5\u05df: <strong>'+score+'</strong><br>\u05d8\u05e2\u05d4: <strong>'+wrong+'</strong>'+(unanswered? ('<br>\u05dc\u05d0 \u05d4\u05e1\u05e4\u05d9\u05e7: '+unanswered):'')+'<br>\u05d6\u05de\u05df: <strong>'+fmt(elapsedMs)+'</strong>'+(timeout?' (\u05e0\u05d2\u05de\u05e8 \u05d4\u05d6\u05de\u05df)':'');
  const me={name:player,score:score,wrong:wrong,ms:elapsedMs};
  const instant=cachedBoard.concat([me]);
  paintBoard(instant, me);
  const q=new URLSearchParams({action:'add',name:player,score:String(score),wrong:String(wrong),ms:String(elapsedMs)});
  fetch(SHEET_API+'?'+q.toString()).then(function(r){return r.json();}).then(function(data){
    cachedBoard=data.items||instant;
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(cachedBoard))}catch(e){}
    paintBoard(cachedBoard, me);
  }).catch(function(){});
}
document.getElementById('again').onclick=function(){document.getElementById('end').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');document.getElementById('name').value=player;};
</script>
</body>
</html>
